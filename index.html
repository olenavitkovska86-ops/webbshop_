<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Home</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <!-- Hamburger -->
      <nav>
        <div class="ham-btn">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </nav>

      <div class="product-menu">
        <button class="close-menu">✕</button>
        <p>Kategorier</p>
        <ul>
          <li><a href="catalog.html">Alla</a></li>
          <li><a href="catalog.html?category=Halsband">Halsband</a></li>
          <li><a href="catalog.html?category=Armband">Armband</a></li>
          <li><a href="catalog.html?category=Ringar">Ringar</a></li>
        </ul>
      </div>

      <!-- Loggo -->
      <h1 onclick="location.href='index.html'" style="cursor: pointer">
        Logga
      </h1>

      <!-- Cart -->

      <button id="open-btn">🛒<span id="cart-count">(0)</span></button>

      <div class="cart">
        <button class="close-btn">✕</button>
        <h2 id="title">Din varukorg</h2>

        <ul id="cart-items">
          <!--Items will be inserted by javaScript-->
        </ul>

        <div class="total-row">
          <span>Att betala</span>
          <button class="total">Pris totalt</button>
        </div>
      </div>
    </header>

    <section id="home">

      <section class="hero-section">
            <img src="img/p00.jpg" alt="Pearls on display" class="hero-img">
        </section>

      
      <p class="text">Välkommen!</p>

      <div class="products">
        <a href="catalog.html" class="product">1</a>
        <a href="catalog.html" class="product">2</a>
        <a href="catalog.html" class="product">3</a>
        <a href="catalog.html" class="product">4</a>
      </div>
    </section>

    <footer class="text">&copy;AB 2025</footer>
    <script src="main.js"></script>
  </body>
</html>
