<!-- <div id="modal"> — тёмный фон, закрывает всю страницу

    class="modal" — нужен для стилей (скрывать/показывать)
    
    <div class="modal-content"> — белое окно pop-up
    
    <span class="close">✖</span> — кнопка "закрыть"
    
    <h2>, <img>, <p> — это место, куда мы будем подставлять данные выбранной карточки
