<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Katalog</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ================= HEADER ================= -->
    <header class="site-header">
      <div class="header-layout">

        <!-- Navigation with hamburger menu -->
        <nav>
          <div class="ham-btn">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </nav>

        <!-- Logo / Home link -->
        <h1 class="logo">
          <a href="index.html">Logga</a>
        </h1>

        <!-- Cart button that opens the shopping cart -->
        <button id="open-btn">🛒<span id="cart-count">(0)</span></button>
      </div>
    </header>

    <!-- ================= CATEGORY MENU ================= -->
    <!-- Hidden slide-in menu that shows product categories -->
    <div class="product-menu">
      <button class="close-menu">✕</button>
      <p>Kategorier</p>
      <ul>
        <li><a href="catalog.html">Alla</a></li>
        <li><a href="catalog.html?category=Halsband">Halsband</a></li>
        <li><a href="catalog.html?category=Armband">Armband</a></li>
        <li><a href="catalog.html?category=Ringar">Ringar</a></li>
      </ul>
    </div>

    <!-- ================= SHOPPING CART ================= -->
    <!-- Hidden cart that is opened with the cart button -->
    <div class="cart">
      <button class="close-btn">✕</button>

      <div class="cart-header">
        <h2 id="title">Din varukorg</h2>

        <!-- Clears all items from the cart -->
        <button id="clear-cart" class="clear-btn">Töm varukorgen</button>
      </div>

      <ul id="cart-items">
        <!--Items will be inserted by javaScript-->
      </ul>

      <!-- Displays the total price -->
      <div class="total-row">
        <span>Att betala</span>
        <p id="cart-total">Totalt: 0 kr</p>
      </div>
    </div>

    <!-- ================= PRODUCT CATALOG ================= -->
    <!-- Container where JavaScript renders product cards -->
    <section id="catalog">
      <div id="cards"></div>
    </section>


    <!-- ================= PRODUCT MODAL ================= -->
    <!-- Popup that shows detailed product information -->
    <div id="modal-product" class="modal">
      <div class="modal-content">

        <!-- Button to close the modal -->
        <button class="modal-close" type="button" onclick="closeModal()">✕</button>
    
        <div class="modal-body">
          <!-- Product image -->
          <div class="modal-media">
            <img id="modal-img" alt="">
          </div>

          <!-- Product text information -->
          <div class="modal-info">
            <h2 id="modal-name"></h2>
            <p id="modal-price"></p>
    
            <!-- Adds the selected product to the cart -->
            <button class="modal-add" type="button" onclick="addProductFromModal()">
              Lägg till i varukorgen
            </button>
    
            <h3>Detaljer</h3>
            <p id="modal-details"></p>
    
            <h3>Beskrivning</h3>
            <p id="modal-desc"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= FOOTER ================= -->
    <footer>&copy;AB 2025</footer>


    <!-- Main JavaScript file -->
    <script src="main.js"></script>
  </body>
</html>
